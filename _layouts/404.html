<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% include head-seo.html %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <script src="https://kit.fontawesome.com/848cf172bf.js" crossorigin="anonymous"></script>
    <script defer src="https://code.jquery.com/jquery-3.3.0.min.js" integrity="sha256-RTQy8VOmNlT6b2PIRur37p6JEBZUE7o8wPgMvu18MC4=" crossorigin="anonymous"></script>
    <script defer src="{{ "/assets/js/main.js" | relative_url }}"></script>
    <script src="{{ "/assets/js/mermaid.js" | relative_url }}" type="module"></script>
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <section style="flex-basis: 65%; height: fit-content; margin: auto;">
      <div id="phoneHeader">
        <h1><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
      </div>

      <article>
<h1>{{ page.title }}</h1>

{{content}}

</article>

<div class="post-nav" role="navigation" aria-label="More writeups">
  <hr style="width:100%; background: #373c3e;">
  {% if page.previous %}<p style="float: left; font-weight: bolder;"> < <a href="{{ page.previous.url | relative_url }}" rel="prev">{{ page.previous.title }}</a></p>{% endif %}
  {% if page.next %}<p style="float: right; font-weight: bolder;"><a href="{{ page.next.url | relative_url }}" rel="next">{{ page.next.title }}</a> > </p>{% endif %}
  <p style="clear: both; text-align: center; font-weight: 900;"><a href="https://0xw1ld.github.io/">Return to home</a></p>
</div>

      </section>
    </div>
  </body>
</html>
