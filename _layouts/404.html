<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% include head-seo.html %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <script src="https://kit.fontawesome.com/848cf172bf.js" crossorigin="anonymous"></script>
    <script defer src="https://code.jquery.com/jquery-3.3.0.min.js" integrity="sha256-RTQy8VOmNlT6b2PIRur37p6JEBZUE7o8wPgMvu18MC4=" crossorigin="anonymous"></script>
    <script defer src="{{ "/assets/js/main.js" | relative_url }}"></script>
    <script src="{{ "/assets/js/mermaid.js" | relative_url }}" type="module"></script>
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper" style="width: 45%;">
      <section style="flex-basis: auto; height: fit-content;">
      <div id="phoneHeader">
        <h1><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
      </div>

      {{ content }}

      </section>
    </div>
  </body>
</html>
